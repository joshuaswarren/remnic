name: Review Round Dispatch

# Transactional review rounds (issue #1992, umbrella #1988 decision E).
#
# Maintains a per-PR round ledger and decides when the next bot review round may
# be dispatched. v1 is visibility-first (umbrella decision C): the ledger comment
# is always written, but reviewer dispatch stays a no-op unless
# REVIEW_ROUND_ENFORCE=true. This workflow NEVER fails a check and NEVER hides an
# unresolved thread — the review-thread-guard remains the merge gate on threads.
#
# This is a SEPARATE workflow so it never adds concurrency to review-thread-guard
# (whose missing concurrency group check-unsticker relies on — non-goal in #1992)
# nor to ai-review-gate. Its own per-PR group coalesces bursts and never
# force-cancels (cancel-in-progress: false), mirroring the gate's scheduling.
#
# The decision logic lives in scripts/review-round-gate.mjs + review-rounds.mjs
# (unit-tested); the step imports it directly rather than mirroring it inline.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  # Top-level PR comments (a bot verdict posted as an issue comment) are read by
  # the gate as bot activity, so wake on them too (GitHub files PR comments under
  # issue_comment). The gate's own comments use GITHUB_TOKEN, which does not
  # re-trigger workflows, so this cannot self-loop (issue #1992 P2).
  issue_comment:
    types: [created, edited]
  # A bot completing only a check run (Cursor-style verdict) must also wake the
  # gate — otherwise the ledger will not advance until an unrelated
  # push/comment/label fires (issue #1992 P2). GitHub Actions has NO
  # pull_request_review_thread trigger, so UI thread resolve/unresolve cannot
  # wake a workflow directly; it advances on the next supported event.
  check_run:
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  # checks.listForRef (current-head bot check-run detection) needs Checks read;
  # without it a restricted token 403s and the read path silently no-ops.
  checks: read

concurrency:
  group: review-round-dispatch-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  round-dispatch:
    # Draft PRs are skipped in runRoundGate too; for check_run events
    # pull_request is absent, so `!= true` lets the job run and the driver
    # re-checks draft via pulls.get.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Evaluate transactional review round
        uses: actions/github-script@v7
        env:
          # Shadow by default (decision D): enforcement flip is PR3, after
          # shadow data lands. Set to 'true' only after the sandbox check.
          REVIEW_ROUND_ENFORCE: 'false'
          # Detection aliases MUST cover every bot the round dispatches
          # (@coderabbitai + @codex) plus Cursor's check-run, or their responses
          # would not be recognized as round activity (issue #1992).
          REQUIRED_AI_REVIEWER_GROUPS: >-
            cursor-bugbot[bot]|cursor[bot]|cursor-bugbot|cursor|coderabbitai[bot]|coderabbitai|chatgpt-codex-connector[bot]|chatgpt-codex-connector
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const modulePath = `${process.env.GITHUB_WORKSPACE}/scripts/review-round-gate.mjs`;
            const mod = await import(pathToFileURL(modulePath).href);
            await mod.runRoundGate({ github, context, core, env: process.env });
