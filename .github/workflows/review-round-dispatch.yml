name: Review Round Dispatch

# Transactional review rounds (issue #1992, umbrella #1988 decision E).
# Maintains a per-PR round ledger and decides when the next bot review round may
# be dispatched. Reviewer dispatch stays a no-op unless
# REVIEW_ROUND_ENFORCE=true, but the round-BUDGET ledger is enforcing
# (issue #2442): a one-time warning reply posts at fix round 3, and at fix
# round 4 ONE backlog issue is filed listing every still-open non-critical
# thread, the PR is labeled review-round:cap, and the issue is linked from the
# ledger. This workflow NEVER fails a check and NEVER blocks merge or hides an
# unresolved thread — the review-thread-guard remains the merge gate on threads.
#
# This is a SEPARATE workflow so it never adds concurrency to review-thread-guard
# (whose missing concurrency group check-unsticker relies on — non-goal in #1992)
# nor to ai-review-gate. Its own per-PR group coalesces bursts and never
# force-cancels (cancel-in-progress: false), mirroring the gate's scheduling.
#
# The decision logic lives in scripts/review-round-gate.mjs + review-rounds.mjs
# (unit-tested); the step imports it directly rather than mirroring it inline.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  # Top-level PR comments (a bot verdict posted as an issue comment) are read by
  # the gate as bot activity, so wake on them too (GitHub files PR comments under
  # issue_comment). The gate's own comments use GITHUB_TOKEN, which does not
  # re-trigger workflows, so this cannot self-loop (issue #1992 P2).
  issue_comment:
    types: [created, edited]
  # A bot completing only a check run (Cursor-style verdict) must also wake the
  # gate — otherwise the ledger will not advance until an unrelated
  # push/comment/label fires (issue #1992 P2). GitHub Actions has NO
  # pull_request_review_thread trigger, so UI thread resolve/unresolve cannot
  # wake a workflow directly; it advances on the next supported event.
  check_run:
    types: [completed]

# Least privilege (issue #1992 hardening): the gate only writes ISSUE comments
# and labels (issues:write) and READS PR/review/thread/check data. It never
# mutates PR objects, so pull-requests stays read-only, shrinking the blast
# radius of the github-script step. NOTE: fork PRs receive a read-only
# GITHUB_TOKEN from GitHub regardless of this block; the full "run trusted base
# code, not the PR checkout" restructure lands with the PR3 enforcement flip
# (when write side effects actually fire).
permissions:
  contents: read
  issues: write
  pull-requests: read
  # checks.listForRef (current-head bot check-run detection) needs Checks read;
  # without it a restricted token 403s and the read path silently no-ops.
  checks: read

concurrency:
  group: review-round-dispatch-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  round-dispatch:
    # Trusted-ref execution (issue #1992 security): the pull_request family is the
    # ONLY path where actions/checkout pulls the PR-HEAD ref, so the write-scoped
    # github-script step would execute PR-controlled code. Restrict that path to
    # SAME-REPO (trusted) PRs; fork PRs are untrusted and also get a read-only
    # token from GitHub, so they are skipped here. check_run/issue_comment run
    # with GITHUB_SHA = the default branch (trusted code), so they need no such
    # guard. Also skip drafts, and require an associated PR for check_run /
    # a PR-scoped comment for issue_comment (cursor).
    if: >-
      (github.event.pull_request && github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'check_run' && github.event.check_run.pull_requests[0] != null) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Evaluate transactional review round
        uses: actions/github-script@v7
        env:
          # Gates REVIEWER DISPATCH only (shadow by default, decision D: the
          # dispatch flip is PR3, after shadow data lands). The round-budget
          # ledger (warn at 3, cap backlog issue at 4, issue #2442) enforces
          # regardless of this flag — it never fails a check or blocks merge.
          REVIEW_ROUND_ENFORCE: 'false'
          # Detection aliases MUST cover every bot the round dispatches
          # (@coderabbitai + @codex) plus Cursor's check-run, or their responses
          # would not be recognized as round activity (issue #1992).
          REQUIRED_AI_REVIEWER_GROUPS: >-
            cursor-bugbot[bot]|cursor[bot]|cursor-bugbot|cursor|coderabbitai[bot]|coderabbitai|chatgpt-codex-connector[bot]|chatgpt-codex-connector
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const modulePath = `${process.env.GITHUB_WORKSPACE}/scripts/review-round-gate.mjs`;
            const mod = await import(pathToFileURL(modulePath).href);
            await mod.runRoundGate({ github, context, core, env: process.env });
