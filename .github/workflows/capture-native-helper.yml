name: capture-native-helper

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/capture-native-darwin-helper/**'
      - 'packages/capture-native-darwin-arm64/**'
      - 'packages/capture-native-darwin-x64/**'
      - 'packages/capture-screen/**'
      - '.github/workflows/capture-native-helper.yml'
  push:
    branches: [main]
    paths:
      - 'packages/capture-native-darwin-helper/**'
      - 'packages/capture-native-darwin-arm64/**'
      - 'packages/capture-native-darwin-x64/**'
      - 'packages/capture-screen/**'
      - '.github/workflows/capture-native-helper.yml'
  release:
    # The historic publish trigger. In practice unreachable for releases
    # created by release-and-publish.yml: that workflow uses the default
    # GITHUB_TOKEN, and GitHub does not start workflow runs for events
    # caused by GITHUB_TOKEN. The active trigger is the `workflow_dispatch`
    # below, dispatched from release-and-publish.yml after the release is
    # created, and the publish job's `if` accepts both paths.
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-native-helper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compile + unit-test the unified Swift helper on real macOS runners, one per
  # target arch, then stage the built binary into its platform package and run
  # that package's Node test. Swift cannot be built or run on Linux, so this
  # job is the only place the native helper is actually proven.
  swift:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            platformPackage: packages/capture-native-darwin-arm64
          - runner: macos-15-intel
            arch: x64
            platformPackage: packages/capture-native-darwin-x64
    name: swift (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pin a toolchain that provides Swift 5.10 (swift-tools-version in
      # Package.swift). latest-stable satisfies this on both runner images.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Build helper (release)
        working-directory: packages/capture-native-darwin-helper
        run: swift build -c release

      - name: Test helper
        working-directory: packages/capture-native-darwin-helper
        run: swift test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Stage built binary into platform package
        run: |
          set -euo pipefail
          bin_dir="$(cd packages/capture-native-darwin-helper && swift build -c release --show-bin-path)"
          mkdir -p "${{ matrix.platformPackage }}/bin"
          cp "${bin_dir}/remnic-capture-helper" "${{ matrix.platformPackage }}/bin/remnic-capture-helper"
          chmod +x "${{ matrix.platformPackage }}/bin/remnic-capture-helper"

      - name: Platform package test
        working-directory: ${{ matrix.platformPackage }}
        run: node test.mjs

      - name: Smoke-test helper CLI surface
        working-directory: ${{ matrix.platformPackage }}
        run: |
          set -euo pipefail
          ./bin/remnic-capture-helper --help
          # device-enumerate needs no TCC grant and must emit one JSON line.
          ./bin/remnic-capture-helper device-enumerate | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s);if(!Array.isArray(o.devices))throw new Error("device-enumerate did not emit a devices array");console.log("device-enumerate ok:",o.devices.length,"entries")})'

      - name: Upload helper binary
        uses: actions/upload-artifact@v4
        with:
          name: remnic-capture-helper-${{ matrix.arch }}
          path: ${{ matrix.platformPackage }}/bin/remnic-capture-helper
          if-no-files-found: error


  publish:
    # Reachable from two paths:
    #   1. A `release: published` event (the historic trigger).
    #   2. A `workflow_dispatch` from a vX.Y.Z tag ref. The dispatch comes
    #      from release-and-publish.yml after it creates the GitHub release,
    #      because GitHub does not start workflow runs for events caused by
    #      GITHUB_TOKEN (only `workflow_dispatch` and `repository_dispatch`
    #      are exempt). The dispatch is needed so the darwin platform
    #      packages actually publish on every release; otherwise the `release`
    #      event here never fires for releases created by the default
    #      GITHUB_TOKEN, and @remnic/capture-native-darwin-{arm64,x64} have
    #      never made it to npm.
    # The dispatch-only ref guard (`startsWith(github.ref, 'refs/tags/v')`)
    # is the GitHub-native part. The strict vX.Y.Z anchor is enforced by
    # the `Validate ref is a vX.Y.Z tag` step below, which sets
    # `is_release_tag` and gates the rest of the job on it. Branch and PR
    # refs cannot reach `pnpm publish`.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v'))
    needs: swift
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platformPackage: packages/capture-native-darwin-arm64
          - arch: x64
            platformPackage: packages/capture-native-darwin-x64
    name: publish (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # When this job runs from a workflow_dispatch (rather than a real
      # `release` event), confirm the dispatch ref matches a vX.Y.Z tag
      # exactly. The job-level `if` already required
      # `startsWith(github.ref, 'refs/tags/v')`, so the only way to reach
      # this step is a dispatch from a v-prefixed tag, but `refs/tags/v9`,
      # `refs/tags/v9.69`, or `refs/tags/v9.69.90-rc.1` would all satisfy
      # the job guard. Anchor the regex here so the only ref shape that
      # reaches `pnpm publish` is `refs/tags/vX.Y.Z` exactly. For a real
      # `release` event we set the output directly so the downstream
      # steps still run.
      #
      # Security: ${{ github.ref }} is passed via the step's `env:` block
      # (quoted shell variable in the regex) rather than directly
      # interpolated into the bash source. Direct interpolation would let
      # a tag name like `v$(rm -rf /)` execute commands inside this
      # trusted-publishing job before the regex rejects it. Anyone able to
      # create a tag and dispatch this workflow can reach this step (the
      # job-level `if` only requires startsWith('refs/tags/v')), so the
      # injection surface is real until the env passthrough is in place.
      - name: Validate ref is a vX.Y.Z tag
        id: ref_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "release" ]; then
            echo "is_release_tag=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${DISPATCH_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Ref ${DISPATCH_REF} is not a vX.Y.Z tag; refusing to publish."
            echo "is_release_tag=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Download helper binary
        if: steps.ref_check.outputs.is_release_tag == 'true'
        uses: actions/download-artifact@v4
        with:
          name: remnic-capture-helper-${{ matrix.arch }}
          path: ${{ matrix.platformPackage }}/bin

      - name: Mark helper executable
        if: steps.ref_check.outputs.is_release_tag == 'true'
        run: chmod +x "${{ matrix.platformPackage }}/bin/remnic-capture-helper"

      - name: Install pnpm
        if: steps.ref_check.outputs.is_release_tag == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.ref_check.outputs.is_release_tag == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org

      - name: Install npm 11 for trusted publishing
        if: steps.ref_check.outputs.is_release_tag == 'true'
        run: npm install -g npm@11.16.0

      - name: Publish platform package
        if: steps.ref_check.outputs.is_release_tag == 'true'
        working-directory: ${{ matrix.platformPackage }}
        run: |
          set -euo pipefail
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_version="$(node -p "require('./package.json').version")"
          if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
            echo "::notice::${pkg_name}@${pkg_version} already published; skipping."
            exit 0
          fi
          publish_log="$(mktemp)"
          if pnpm publish --access public --provenance --no-git-checks --tag alpha >"$publish_log" 2>&1; then
            cat "$publish_log"
            rm -f "$publish_log"
            exit 0
          fi
          cat "$publish_log"
          if grep -q "npm error code E404" "$publish_log"; then
            echo "::error::Provision npm trusted publishing for ${pkg_name}, then rerun this workflow."
            rm -f "$publish_log"
            exit 1
          fi
          rm -f "$publish_log"
          exit 1

  # The screen-activity daemon (@remnic/capture-screen) is TypeScript and is
  # proven on Linux like the rest of the workspace.
  screen-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: screen (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # capture-screen's check-types resolves @remnic/core types.
      - name: Build core
        run: pnpm --filter @remnic/core build

      - name: Typecheck capture-screen
        run: pnpm --filter @remnic/capture-screen run check-types

      - name: Test capture-screen
        run: pnpm --filter @remnic/capture-screen run test
