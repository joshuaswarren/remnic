name: Release Promote

# Channel promotion (issue #3032). A promotion is a dist-tag MOVE against an
# already-published, byte-identical version: nothing is rebuilt, re-packed, or
# republished here. `alpha` is produced by release-and-publish.yml on every
# merge to main; this workflow moves `beta` and `latest` (stable) onto a version
# that already soaked as alpha. See docs/releases.md for the cut rules.
#
# GitHub lookups use REST (`gh api repos/...`) only — the GraphQL points budget
# is shared with interactive work and is not spent by release automation.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to promote, exactly X.Y.Z (no leading v).'
        required: true
        type: string
      channel:
        description: 'Channel to move onto that version.'
        required: true
        type: choice
        options:
          - beta
          - stable
      hotfix:
        description: 'Fast-track a fix for a defect in current stable (waives the stable soak window). Recorded in the run.'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Verify every criterion and print the planned dist-tag moves without performing them. Performs no registry write and does not prove the moves would be authorized.'
        required: false
        default: false
        type: boolean
      seed_cleanup_x64:
        description: 'Temporary diagnostic: remove only the x64 seed latest tag.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-promote
  cancel-in-progress: false

jobs:
  promote:
    if: inputs.seed_cleanup_x64 != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      HOTFIX: ${{ inputs.hotfix }}
      DRY_RUN: ${{ inputs.dry_run }}
      # Minimum days a version must sit on `beta` before it may become stable.
      STABLE_SOAK_DAYS: '7'
      GH_TOKEN: ${{ github.token }}
    steps:
      # Validate the exact strings the caller supplied. Nothing is trimmed,
      # case-folded, or otherwise normalized before the check: a value that is
      # not already exactly right is rejected rather than reinterpreted.
      - name: Validate inputs
        run: |
          set -euo pipefail
          case "${VERSION}" in
            *[!0-9.]*|*..*|.*|*.) echo "::error title=Invalid version::'${VERSION}' must be exactly X.Y.Z with no leading v."; exit 1 ;;
          esac
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Invalid version::'${VERSION}' must be exactly X.Y.Z with no leading v."
            exit 1
          fi
          case "${CHANNEL}" in
            beta) DIST_TAG=beta ;;
            stable) DIST_TAG=latest ;;
            *) echo "::error title=Invalid channel::'${CHANNEL}' must be beta or stable."; exit 1 ;;
          esac
          case "${HOTFIX}" in true|false) ;; *) echo "::error title=Invalid hotfix::'${HOTFIX}' must be true or false."; exit 1 ;; esac
          case "${DRY_RUN}" in true|false) ;; *) echo "::error title=Invalid dry_run::'${DRY_RUN}' must be true or false."; exit 1 ;; esac
          echo "DIST_TAG=${DIST_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "Promoting ${VERSION} to ${CHANNEL} (dist-tag ${DIST_TAG}); hotfix=${HOTFIX}; dry_run=${DRY_RUN}"

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      # npm 11.21.0 adds OIDC support for dist-tag commands.
      - name: Pin npm with dist-tag OIDC support
        run: npm install -g npm@11.21.0

      - name: Resolve the release commit
        run: |
          set -euo pipefail
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          OBJECT_TYPE="$(printf '%s' "${REF_JSON}" | jq -r '.object.type')"
          OBJECT_SHA="$(printf '%s' "${REF_JSON}" | jq -r '.object.sha')"
          if [ "${OBJECT_TYPE}" = "tag" ]; then
            OBJECT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJECT_SHA}" -q '.object.sha')"
          fi
          if ! printf '%s' "${OBJECT_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=Unresolved release tag::${RELEASE_TAG} did not resolve to a commit SHA."
            exit 1
          fi
          echo "RELEASE_SHA=${OBJECT_SHA}" >> "$GITHUB_ENV"
          echo "${RELEASE_TAG} -> ${OBJECT_SHA}"

      # The release tag is an old immutable snapshot; it does not contain the
      # CI-gate script introduced for release-promote. Pin the helper checkout
      # to the EXACT commit the workflow was dispatched from (github.workflow_sha)
      # so a main advance after dispatch cannot swap in a different helper.
      # The tag checkout above is preserved for everything else (npm package
      # existence, publish-order, the dist-tag moves themselves).
      - name: Fetch workflow sources from the dispatched commit
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          WORKFLOW_SRC="${RUNNER_TEMP}/remnic-workflow-src"
          rm -rf "${WORKFLOW_SRC}"
          git clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" "${WORKFLOW_SRC}"
          git -C "${WORKFLOW_SRC}" checkout --detach "${WORKFLOW_SHA}"
          echo "WORKFLOW_SRC=${WORKFLOW_SRC}" >> "$GITHUB_ENV"
          test -f "${WORKFLOW_SRC}/scripts/release-promote-ci-gate.mjs"

      # Cut rule: the target version's CI must be green. Two live facts forced
      # the rewrite:
      #   1. Release tags point at a `chore(release): vX.Y.Z [skip ci]` commit
      #      whose only check-runs are `promote`/`unstick`/`Dependabot` — no
      #      real CI. The script therefore uses the chore commit's FIRST PARENT
      #      as the "source commit" (the merge commit that produced the release).
      #   2. After a squash merge, that first parent IS the squash commit. The
      #     ruleset that allowed the merge evaluated the PR HEAD sha, not the
      #      squash sha (e.g. PR #3155 -> head f4e2c028, not 2e02177ac). The
      #      squash sha's own push-event CI runs post-merge and can legitimately
      #      fail (`quality` did, on 2026-10-02) without invalidating the merge
      #      gate. We therefore retarget to the merged PR's head sha when the
      #      source commit is a squash commit; for true merge commits the
      #      second parent is the PR head.
      #
      # Only the contexts the main ruleset marks as required can block.
      # Informational/non-required contexts (Dependabot, latest-openclaw-scanner,
      # `checks`, etc.) and the promoter's own job cannot block — reading the
      # ruleset per-run catches required-context drift instead of stale embedded
      # lists. Failure to read the ruleset fails closed.
      - name: Verify CI is green on the release commit
        run: |
          set -euo pipefail
          REPO="repos/${GITHUB_REPOSITORY}"
          # Walk the release commit chain. release-and-publish.yml may commit
          # the chore(release) commit plus a workspace-bump commit plus a
          # CHANGELOG promotion commit before tagging — the tag points at the
          # LAST of those, but the real "source" merge commit is the first
          # parent of the chain. A release commit is recognisable by subject
          # `chore(release): ...` or `docs(changelog): promote [Unreleased]
          # -> vX.Y.Z ...`; both are generated, both carry [skip ci]. Walk
          # parents until the first commit that is NOT a release-chain commit
          # — that is the merge commit that produced the release.
          is_release_chain_commit() {
            # Fetch the subject directly. A transient API failure must abort
            # the step rather than silently end the walk with the predicate
            # returning false (which would evaluate an untested release commit
            # and surface a confusing "missing check-run" message).
            local subject
            if ! subject="$(gh api "${REPO}/commits/$1" --jq '.commit.message | split("\n")[0]')"; then
              echo "::error title=Release-chain walk failed::gh api commits/$1 exited non-zero; cannot resolve release source."
              exit 1
            fi
            printf '%s' "${subject}" \
              | grep -Eq '^(chore\(release\)|docs\(changelog\): promote \[Unreleased\] -> v).* \[skip ci\]$'
          }
          CURRENT="${RELEASE_SHA}"
          MAX_STEPS=10
          STEPS=0
          while [ "${STEPS}" -lt "${MAX_STEPS}" ] && is_release_chain_commit "${CURRENT}"; do
            CURRENT="$(gh api "${REPO}/commits/${CURRENT}" --jq '.parents[0].sha')"
            STEPS=$((STEPS + 1))
          done
          if [ "${STEPS}" -eq 0 ]; then
            echo "Release tag points at ${RELEASE_SHA} (not a generated release commit); evaluating it directly."
          else
            echo "Release tag points at a generated release commit; walked ${STEPS} step(s) back to ${CURRENT} as the source."
          fi
          SOURCE_SHA="${CURRENT}"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"

          # If SOURCE_SHA is a squash commit (one parent) associated with a
          # merged PR, retarget the evaluation to the PR head — that is the
          # commit the ruleset actually gated for the merge. For true merge
          # commits (two parents), the PR head is the second parent.
          EVAL_SHA="${SOURCE_SHA}"
          EVAL_NOTE=""
          PARENT_COUNT="$(gh api "${REPO}/commits/${SOURCE_SHA}" --jq '.parents | length')"
          if [ "${PARENT_COUNT}" -ge 2 ]; then
            EVAL_SHA="$(gh api "${REPO}/commits/${SOURCE_SHA}" --jq '.parents[1].sha')"
            EVAL_NOTE="Source commit is a ${PARENT_COUNT}-parent merge; evaluating PR HEAD"
          else
            # Paginated (the endpoint defaults to per_page=30; a noisy commit
            # can push the matching PR off the first page), filtered to
            # merged-into-main PRs whose merge_commit_sha equals our source.
            PR_HEAD="$(gh api --paginate "${REPO}/commits/${SOURCE_SHA}/pulls" \
              | jq -rs --arg sha "${SOURCE_SHA}" 'map(.[]) | map(select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main")) | .[0].head.sha // empty')"
            if [ -n "${PR_HEAD}" ] && [ "${PR_HEAD}" != "null" ]; then
              EVAL_SHA="${PR_HEAD}"
              EVAL_NOTE="Source commit is a squash; retargeting to associated PR HEAD"
            else
              echo "Source commit has no associated merged PR; evaluating ${SOURCE_SHA} directly."
            fi
          fi

          # Fail closed before EVAL_SHA reaches any API call: a malformed
          # value (quoted string, empty, short sha, embedded newline, or
          # anything other than exactly 40 hex digits) must never turn
          # into a confusing downstream 422. Real dry run 37008248423
          # failed here with a JSON-quoted sha from the retarget above.
          # Bash [[ =~ ]] anchors the match to the whole string (grep -E
          # is line-oriented and would let a value containing a newline
          # plus a trailing 40-hex line pass).
          if ! [[ "${EVAL_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            # Escape the value before embedding it in a workflow command:
            # GitHub decodes % escapes in ::error/::warning payload data,
            # so a hostile or malformed %0A/%25/%0D terminates the command
            # and lets subsequent commands run on the same line.
            EVAL_SHA_SAFE="$(printf '%s' "${EVAL_SHA}" | tr -d '\r\n' | sed -e 's/%/%25/g' -e 's/,/%2C/g')"
            echo "::error title=Bad evaluated SHA::EVAL_SHA='${EVAL_SHA_SAFE}' is not a bare 40-hex commit sha; refusing before any API call."
            exit 1
          fi
          # Print the retarget note only now: the value is validated, so a
          # malformed one can never reach the log as a workflow command.
          if [ -n "${EVAL_NOTE}" ]; then echo "${EVAL_NOTE} ${EVAL_SHA}."; fi
          echo "EVAL_SHA=${EVAL_SHA}" >> "$GITHUB_ENV"

          # Read the effective required-status-checks list for the default
          # branch (where the release merges) directly. If the read fails, fail
          # closed: the gate cannot proceed without knowing what to gate on.
          if ! gh api "${REPO}/rules/branches/main" \
              --jq '[.[] | select(.type=="required_status_checks") | .parameters.required_status_checks[]?.context] | unique' \
              > required-contexts.json 2>required-read.err; then
            echo "::error title=Ruleset unreadable::$(cat required-read.err)"
            exit 1
          fi
          REQUIRED_CTX="$(jq -c . required-contexts.json)"
          if [ "${REQUIRED_CTX}" = "[]" ]; then
            echo "::error title=Ruleset empty::main branch has no required status checks; refusing to promote."
            exit 1
          fi
          echo "Required contexts: ${REQUIRED_CTX}"

          # Merge both endpoints so a required context reported as a legacy
          # commit status (rather than a check run) is still found. The
          # status endpoint only emits a `state` (success/pending/failure)
          # and a single `updated_at`; we project that timestamp into both
          # `started_at` and `completed_at` so the script's latest-record
          # selection treats the status like a completed run.
          : > "${RUNNER_TEMP}/ci-gate-records.jsonl"
          gh api --paginate "${REPO}/commits/${EVAL_SHA}/check-runs" \
            --jq '.check_runs[]? | {name, status, conclusion, started_at, completed_at}' \
            >> "${RUNNER_TEMP}/ci-gate-records.jsonl"
          gh api "${REPO}/commits/${EVAL_SHA}/status" \
            --jq '.statuses[]? | {name: .context, status: "completed", conclusion: .state, started_at: .updated_at, completed_at: .updated_at}' \
            >> "${RUNNER_TEMP}/ci-gate-records.jsonl"
          {
            echo "{ \"type\": \"check-runs\", \"records\": ["
            jq -s '.' "${RUNNER_TEMP}/ci-gate-records.jsonl" | sed 's/^\[//; s/\]$//'
            echo "] }"
          } > "${RUNNER_TEMP}/ci-gate-input.json"

          set +e
          node "${WORKFLOW_SRC}/scripts/release-promote-ci-gate.mjs" \
            --required-contexts "${REQUIRED_CTX}" \
            --self-excluded '["promote"]' \
            --input-file "${RUNNER_TEMP}/ci-gate-input.json" \
            > ci-gate-verdict.json 2> ci-gate-stderr.txt
          VERDICT_EXIT=$?
          set -e
          if [ "${VERDICT_EXIT}" -ne 0 ]; then
            echo "::error title=CI gate script failed::verdict=$(cat ci-gate-verdict.json); stderr=$(tr '\n' ' ' < ci-gate-stderr.txt)"
            exit "${VERDICT_EXIT}"
          fi
          DECISION="$(jq -r '.decision' ci-gate-verdict.json)"
          if [ "${DECISION}" != "allow" ]; then
            REASONS="$(jq -c '.reasons' ci-gate-verdict.json)"
            echo "::error title=CI not green::${REASONS}"
            echo "Evaluated commit: ${EVAL_SHA} (source: ${SOURCE_SHA}, release: ${RELEASE_SHA})."
            exit 1
          fi

          TOTAL="$(wc -l < "${RUNNER_TEMP}/ci-gate-records.jsonl" | tr -d ' ')"
          echo "CI green on ${EVAL_SHA} (${TOTAL} check-run record(s); source=${SOURCE_SHA})."

      # Cut rule: a stable promotion requires the version to have soaked at
      # least STABLE_SOAK_DAYS days since it was published as alpha. The clock
      # comes from the registry's own publish timestamp, not from git.
      - name: Verify soak age
        run: |
          set -euo pipefail
          PUBLISHED_AT="$(npm view "@remnic/core" time --json | jq -r --arg v "${VERSION}" '.[$v] // empty')"
          if [ -z "${PUBLISHED_AT}" ]; then
            echo "::error title=Version not published::@remnic/core@${VERSION} is not on npm; only published versions can be promoted."
            exit 1
          fi
          PUBLISHED_EPOCH="$(date -u -d "${PUBLISHED_AT}" +%s)"
          case "${PUBLISHED_EPOCH}" in
            ''|*[!0-9]*) echo "::error title=Unparseable publish time::'${PUBLISHED_AT}' did not parse to an epoch."; exit 1 ;;
          esac
          NOW_EPOCH="$(date -u +%s)"
          AGE_DAYS=$(( (NOW_EPOCH - PUBLISHED_EPOCH) / 86400 ))
          echo "PUBLISHED_AT=${PUBLISHED_AT}" >> "$GITHUB_ENV"
          echo "AGE_DAYS=${AGE_DAYS}" >> "$GITHUB_ENV"
          echo "@remnic/core@${VERSION} published ${PUBLISHED_AT} (${AGE_DAYS} day(s) ago)."
          if [ "${CHANNEL}" != "stable" ]; then
            exit 0
          fi
          if [ "${HOTFIX}" = "true" ]; then
            echo "::warning title=Soak waived::hotfix=true fast-tracks ${VERSION} to stable after ${AGE_DAYS} day(s)."
            exit 0
          fi
          if [ "${AGE_DAYS}" -lt "${STABLE_SOAK_DAYS}" ]; then
            echo "::error title=Soak too short::${VERSION} has soaked ${AGE_DAYS} day(s); stable requires ${STABLE_SOAK_DAYS}. Re-run with hotfix=true only for a defect in current stable."
            exit 1
          fi

      # Cut rule: no OPEN issue labeled `regression` filed against any release
      # in the range (previous channel version, target]. With no previous
      # channel version the range is unbounded, so every open regression issue
      # blocks — the conservative direction.
      - name: Verify no open regression issues in range
        run: |
          set -euo pipefail
          # `dist-tags --json` exits 0 whether or not the tag exists, so an
          # absent tag reads as empty while a real registry error still fails.
          PREVIOUS="$(npm view "@remnic/core" dist-tags --json | jq -r --arg t "${DIST_TAG}" '.[$t] // empty')"
          RANGE_START=''
          if [ -n "${PREVIOUS}" ]; then
            RANGE_START="$(npm view "@remnic/core" time --json | jq -r --arg v "${PREVIOUS}" '.[$v] // empty')"
          fi
          if [ -n "${RANGE_START}" ]; then
            echo "Range: open regression issues filed after ${RANGE_START} (${DIST_TAG} currently at ${PREVIOUS})."
          else
            echo "::notice title=Unbounded range::No previous ${DIST_TAG} version resolved; every open regression issue blocks this promotion."
          fi
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=regression&per_page=100" \
            --jq '.[] | select(.pull_request == null) | {number, created_at, title}' > regressions.jsonl
          if [ ! -s regressions.jsonl ]; then
            echo "No open regression issues."
            exit 0
          fi
          # No upper bound: a regression against a release in this range can be
          # filed at any later time, and it must still block the promotion.
          jq -s --arg start "${RANGE_START}" '
            map(select($start == "" or .created_at >= $start))
            | map("#" + (.number | tostring) + " " + .title)
          ' regressions.jsonl > blocking-issues.json
          COUNT="$(jq 'length' blocking-issues.json)"
          if [ "${COUNT}" -ne 0 ]; then
            echo "::error title=Open regression issues::${COUNT} open regression issue(s) in range: $(jq -r 'join("; ")' blocking-issues.json)"
            exit 1
          fi
          echo "Open regression issues exist, but none in range."

      - name: Generate workspace package publish order
        run: node scripts/publish-order.mjs --repo-root "$PWD" --output "${RUNNER_TEMP}/remnic-publish-order.txt"

      # All-or-nothing precheck: every public package in PUBLISH_ORDER must
      # already exist on npm at this exact version before a single tag moves.
      # A missing package is the same operator-actionable publish gap the
      # release workflow already fails on, so it aborts here too.
      - name: Plan the dist-tag moves
        run: |
          set -euo pipefail
          mapfile -t PUBLISH_ORDER < "${RUNNER_TEMP}/remnic-publish-order.txt"
          : > "${RUNNER_TEMP}/promote-plan.tsv"
          MISSING=()
          plan_package() {
            local pkg_json="$1"
            if [ ! -f "${pkg_json}" ]; then
              return 0
            fi
            if [ "$(node -p "require('./${pkg_json}').private || false")" = "true" ]; then
              return 0
            fi
            local name
            local pkg_version
            name="$(node -p "require('./${pkg_json}').name")"
            pkg_version="$(node -p "require('./${pkg_json}').version")"
            if [ "${pkg_version}" != "${VERSION}" ]; then
              echo "::error title=Version mismatch::${name} at ${RELEASE_TAG} is ${pkg_version}, not ${VERSION}."
              exit 1
            fi
            if ! npm view "${name}@${VERSION}" version >/dev/null 2>pkg-err.txt; then
              # Surface both sides of the refusal: what publish-order expected
              # and what npm actually answered. The registry's stderr is
              # attacker-controlled text, so strip CR and percent-escapes
              # before the value reaches a workflow command (`::warning`).
              PKG_ERR_RAW="$(tr '\n' ' ' < pkg-err.txt)"
              # shellcheck disable=SC1003
              PKG_ERR_SAFE="$(printf '%s' "${PKG_ERR_RAW}" | tr -d '\r' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g')"
              echo "::warning title=Missing ${name}@${VERSION}::${PKG_ERR_SAFE:-no package record at this version on npm}"
              echo "${name}@${VERSION} not on npm at $(date -u +%FT%TZ); npm said: ${PKG_ERR_RAW:-no record}"
              MISSING+=("${name}@${VERSION}")
              rm -f pkg-err.txt
              return 0
            fi
            rm -f pkg-err.txt
            local current
            current="$(npm view "${name}" dist-tags --json | jq -r --arg t "${DIST_TAG}" '.[$t] // empty')"
            printf '%s\t%s\n' "${name}" "${current:-<unset>}" >> "${RUNNER_TEMP}/promote-plan.tsv"
          }

          plan_package "package.json"
          for pkg_dir in "${PUBLISH_ORDER[@]}"; do
            plan_package "${pkg_dir}/package.json"
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            {
              echo "## Promotion aborted: packages missing at ${VERSION}"
              echo ""
              for entry in "${MISSING[@]}"; do echo "- \`${entry}\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Incomplete release::${#MISSING[@]} package(s) are not published at ${VERSION}; no dist-tag was moved."
            echo "Missing packages (expected at ${VERSION}, none on npm):"
            for entry in "${MISSING[@]}"; do echo "  - ${entry}"; done
            exit 1
          fi

          PLANNED="$(wc -l < "${RUNNER_TEMP}/promote-plan.tsv")"
          if [ "${PLANNED}" -eq 0 ]; then
            echo "::error title=Nothing to promote::PUBLISH_ORDER produced no public packages."
            exit 1
          fi
          {
            echo "## Planned ${DIST_TAG} moves to ${VERSION}"
            echo ""
            echo "| Package | ${DIST_TAG} before |"
            echo "|---|---|"
            while IFS=$'\t' read -r name current; do
              echo "| \`${name}\` | ${current} |"
            done < "${RUNNER_TEMP}/promote-plan.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Planned ${PLANNED} dist-tag move(s)."

      - name: Report dry run
        if: inputs.dry_run == true
        run: |
          set -euo pipefail
          echo "::notice title=Dry run::Every criterion passed. $(wc -l < "${RUNNER_TEMP}/promote-plan.tsv") dist-tag move(s) were planned and NOT performed."
          {
            echo ""
            echo "**Dry run — no dist-tag was moved.** This proves every precheck passed; it does **not** prove the registry would authorize the moves."
          } >> "$GITHUB_STEP_SUMMARY"

      # Move every planned tag, then read the registry back for each one. A
      # readback mismatch or a failed move aborts immediately and reports the
      # exact restore commands for whatever already moved: the previous values
      # were captured in the plan step.
      - name: Move dist-tags
        if: inputs.dry_run == false
        run: |
          set -euo pipefail
          MOVED=()
          abort() {
            {
              echo ""
              echo "### Promotion aborted after ${#MOVED[@]} move(s)"
              echo ""
              if [ "${#MOVED[@]}" -gt 0 ]; then
                echo "Restore the previous ${DIST_TAG} tags with:"
                echo ""
                echo '```bash'
                for entry in "${MOVED[@]}"; do
                  name="${entry%%$'\t'*}"
                  previous="${entry##*$'\t'}"
                  if [ "${previous}" = "<unset>" ]; then
                    echo "npm dist-tag rm ${name} ${DIST_TAG}"
                  else
                    echo "npm dist-tag add ${name}@${previous} ${DIST_TAG}"
                  fi
                done
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # Read the plan on FD 3: npm consumes stdin, which would swallow the
          # remaining lines and silently promote only the first package.
          while IFS=$'\t' read -r -u 3 name previous; do
            if [ "${previous}" = "${VERSION}" ]; then
              echo "Already ${DIST_TAG} -> ${name}@${VERSION}; no registry write or OIDC authorization check."
              continue
            fi
            echo "Moving ${DIST_TAG} -> ${name}@${VERSION} (was ${previous})"
            if ! npm dist-tag add "${name}@${VERSION}" "${DIST_TAG}"; then
              echo "::error title=Dist-tag move failed::${name}@${VERSION} ${DIST_TAG}"
              abort
            fi
            MOVED+=("${name}"$'\t'"${previous}")
            READBACK="$(npm dist-tag ls "${name}")"
            if ! printf '%s\n' "${READBACK}" | grep -Fxq "${DIST_TAG}: ${VERSION}"; then
              echo "::error title=Readback mismatch::${name} does not report ${DIST_TAG}: ${VERSION}."
              printf '%s\n' "${READBACK}"
              abort
            fi
          done 3< "${RUNNER_TEMP}/promote-plan.tsv"

          if [ "${#MOVED[@]}" -eq 0 ]; then
            echo "::notice title=No promotion needed::All tags already point to ${VERSION}; OIDC write authorization was not checked."
            echo "### No-op: ${DIST_TAG} already points to ${VERSION} on every package; no OIDC write authorization was checked." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo ""
            echo "### Promoted ${#MOVED[@]} package(s) to ${DIST_TAG} at ${VERSION}"
            echo ""
            echo "- channel: ${CHANNEL}"
            echo "- hotfix: ${HOTFIX}"
            echo "- soak: ${AGE_DAYS} day(s) since ${PUBLISHED_AT}"
            echo "- release commit: ${RELEASE_SHA}"
            echo "- no tarball was rebuilt or republished"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Promotion complete: ${#MOVED[@]} package(s) now resolve ${DIST_TAG} to ${VERSION}."

  cleanup_seed_x64:
    if: inputs.seed_cleanup_x64 == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11.21.0
      - name: Remove only x64 seed latest and verify OIDC write
        run: |
          set -euo pipefail
          package='@remnic/capture-native-darwin-x64'
          before="$(npm view "${package}" dist-tags --json)"
          test "$(jq -r '.latest' <<< "${before}")" = '0.0.0-seed.1'
          test "$(jq -r '.alpha' <<< "${before}")" = '9.69.94'
          npm dist-tag rm "${package}" latest
          after="$(npm view "${package}" dist-tags --json)"
          test "$(jq -r '.latest // empty' <<< "${after}")" = ''
          test "$(jq -r '.alpha' <<< "${after}")" = '9.69.94'
          echo "Verified OIDC removal: ${package} latest absent, alpha 9.69.94"
