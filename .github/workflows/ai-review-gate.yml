name: AI Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created]
  check_run:
    types: [completed]

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: read

jobs:
  ai-reviewers:
    if: >-
      (github.event_name == 'check_run' &&
        contains(fromJSON('["cursor-bugbot","cursor","coderabbitai"]'), github.event.check_run.app.slug)) ||
      (github.event_name != 'check_run' && github.event.pull_request.draft == false)
    # Coalesce PR-head events, isolate check_run, never force-cancel. All PR-head
    # events (pull_request, pull_request_review, pull_request_review_comment — all
    # land on refs/pull/N/merge) share ONE group so they serialize on the head and
    # exactly one completes the required `ai-reviewers` check; they must NOT race
    # in separate groups (a review run passing while the pull_request poll times
    # out would leave a failed suite — codex OcHGk). `check_run` completions land
    # on the default branch and cannot satisfy the PR-head check, so they get their
    # own group and can never evict a pending PR-head run (codex OcD1Z).
    # cancel-in-progress:false never force-cancels a running evaluation, so a
    # required check is never left `cancelled` on the head SHA (the stuck-merge
    # mode check-unsticker was clearing); a superseded run self-exits via the
    # head-SHA guard. Coverage unchanged: the PR head always gets a complete
    # evaluation before merge.
    concurrency:
      group: ai-review-gate-${{ github.event_name == 'check_run' && 'checkrun' || 'prhead' }}-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout review helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Bootstrap transient GitHub retry helper
        run: |
          if [ ! -f scripts/github-transient-retry.mjs ]; then
            echo "::notice title=ai-review-gate bootstrap::scripts/github-transient-retry.mjs absent on base — using PR head copy"
            git fetch --quiet --depth=1 origin "$HEAD_SHA"
            git checkout FETCH_HEAD -- scripts/github-transient-retry.mjs
          fi
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check AI review activity
        uses: actions/github-script@v7
        env:
          REQUIRED_AI_REVIEWER_GROUPS: >-
            cursor-bugbot[bot]|cursor[bot]|cursor-bugbot|cursor|coderabbitai[bot]|coderabbitai
          TRUSTED_AI_AGENT_REVIEWERS: ${{ vars.TRUSTED_AI_AGENT_REVIEWERS }}
        with:
          script: |

            // Keep effective-diff semantics in the tested repository module. The
            // workflow imports the base revision so a PR cannot change the
            // evaluator that decides whether its own review is required.
            const { pathToFileURL } = require("node:url");
            const {
              associatedPullRequestNumbers,
              canUseDependabotManifestException,
              evaluateAiReviewGate,
              parseReviewerGroups,
            } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ai-review-gate.mjs`).href);
            const {
              parseIgnoreManifest,
              splitEffectiveDiff,
              isArtifactOnlyPullRequest,
            } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/effective-diff.mjs`).href);
            const { withTransientGithubRetry, isTransientGithubLookupError } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github-transient-retry.mjs`).href
            );
            const IGNORE_MANIFEST_PATH = ".github/ai-review-ignore";


            // Load the manifest from the PR's BASE ref: a PR can never exempt
            // itself by editing the manifest in the same PR — pattern changes
            // only take effect after merge (issue #1991 security invariant).
            // Missing manifest => no exception. Malformed manifest => WARN and
            // no exception (the fail-safe direction is "require review").
            async function loadIgnoreManifest(owner, repo, baseRef) {
              if (!baseRef) return null;
              let payload;
              try {
                payload = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: IGNORE_MANIFEST_PATH,
                  ref: baseRef,
                });
              } catch (error) {
                if (error?.status === 404) return null;
                core.warning(`Could not load ${IGNORE_MANIFEST_PATH} at ${baseRef}: ${error?.message ?? error}`);
                return null;
              }
              try {
                const text = Buffer.from(payload.data.content ?? '', payload.data.encoding ?? 'base64').toString('utf8');
                return parseIgnoreManifest(text);
              } catch (error) {
                core.warning(`Malformed ${IGNORE_MANIFEST_PATH} — artifact exception disabled for safety: ${error?.message ?? error}`);
                return null;
              }
            }


            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pullRequestNumbers = associatedPullRequestNumbers(context.payload);
            if (pullRequestNumbers.length === 0) {
              if (context.eventName === 'check_run') {
                core.notice('Skipping check_run event with no associated pull request.');
                return;
              }
              core.setFailed('Unable to determine pull request number.');
              return;
            }
            const groupsRaw = process.env.REQUIRED_AI_REVIEWER_GROUPS || '';
            const groups = parseReviewerGroups(groupsRaw);
            const trustedAgentLogins = parseReviewerGroups(process.env.TRUSTED_AI_AGENT_REVIEWERS).flat();

            if (groups.length === 0) {
              core.setFailed('No required AI reviewer groups configured.');
              return;
            }

            // Anchor this run to the head SHA that triggered it (pull_request
            // events only). If the head advances mid-poll a newer run gates the
            // new head, so this run self-supersedes below instead of polling a
            // stale head to the deadline. Non-PR events (review/comment/
            // check_run) have no trigger-head anchor and keep follow-the-head.
            const triggerHeadSha =
              typeof context.payload.pull_request?.head?.sha === 'string'
                ? context.payload.pull_request.head.sha
                : null;

            async function evaluatePullRequests() {
              const failures = [];
              let evaluatedCount = 0;
              let hasBlockers = false;

              for (const pr of pullRequestNumbers) {
                try {
                const pullRequest = await withTransientGithubRetry(() =>
                  github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: pr,
                  }),
                );
                if (pullRequest.data.draft) {
                  core.notice(`Skipping draft pull request #${pr}.`);
                  continue;
                }
                evaluatedCount += 1;

                const reviews = await withTransientGithubRetry(() =>
                  github.paginate(github.rest.pulls.listReviews, {
                    owner,
                    repo,
                    pull_number: pr,
                    per_page: 100,
                  }),
                );

                const issueComments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: pr,
                  per_page: 100,
                });

                const prComments = await github.paginate(github.rest.pulls.listReviewComments, {
                  owner,
                  repo,
                  pull_number: pr,
                  per_page: 100,
                });

                const headSha = pullRequest.data.head.sha;
                const headCommit = headSha
                  ? await github.rest.repos.getCommit({
                      owner,
                      repo,
                      ref: headSha,
                    })
                  : null;
                const headCommittedAt =
                  headCommit?.data?.commit?.committer?.date ??
                  headCommit?.data?.commit?.author?.date ??
                  null;
                const checkRuns = headSha
                  ? await github.paginate(github.rest.checks.listForRef, {
                      owner,
                      repo,
                      ref: headSha,
                      per_page: 100,
                    })
                  : [];

                const result = evaluateAiReviewGate({
                  groups,
                  headSha,
                  headCommittedAt,
                  authorLogin: pullRequest.data.user?.login,
                  trustedAgentLogins,
                  reviews,
                  issueComments,
                  reviewComments: prComments,
                  checkRuns,
                });

                core.info(
                  `PR #${pr} positive current-head AI review activity from: ${
                    result.present.map(p => `${p.alias}(${p.kind}:${p.state})`).join(', ') || 'none'
                  }`,
                );

                if ((result.participated ?? []).length > 0) {
                  core.info(
                    `PR #${pr} current-head reviewer participation (any verdict): ${result.participated.join(', ')}`,
                  );
                }

                if (result.blockers.length > 0) {
                  core.info(
                    `PR #${pr} blocking AI review activity: ${
                      result.blockers.map(b => `${b.alias}(${b.state})`).join(', ')
                    }`,
                  );
                  hasBlockers = true;
                }

                if (!result.ok && result.blockers.length === 0) {
                  const files = await github.paginate(github.rest.pulls.listFiles, {
                    owner,
                    repo,
                    pull_number: pr,
                    per_page: 100,
                  });

                  // Artifact-only exception (issue #1991): a PR whose changed
                  // files ALL match .github/ai-review-ignore (read from the
                  // BASE ref) needs no AI review round — bots cannot say
                  // anything useful about generated corpora, and the rounds
                  // they burn on them bury real findings. Threads bots file
                  // anyway still gate via review-thread-guard (unchanged).
                  // GitHub's listFiles API returns at most 3,000 files total;
                  // beyond that the list is TRUNCATED and unseen files could be
                  // real source. The list is provably complete when the fetched
                  // count matches the PR's reported changed_files (including
                  // exactly 3,000); without a usable reported count, anything
                  // at the cap is treated as truncated. Fail-safe direction is
                  // 'require review' (review findings on #2002, rounds 1+2).
                  const reportedChangedFiles = pullRequest.data.changed_files;
                  const fileListComplete =
                    typeof reportedChangedFiles === 'number'
                      ? reportedChangedFiles === files.length
                      : files.length < 3000;
                  const ignorePatterns = fileListComplete
                    ? await loadIgnoreManifest(owner, repo, pullRequest.data.base?.sha)
                    : null;
                  if (!fileListComplete) {
                    core.info(
                      `PR #${pr}: file list may be truncated (${files.length} fetched, API reports ${reportedChangedFiles ?? 'unknown'}) — artifact-only exception not considered.`,
                    );
                  }
                  if (ignorePatterns && isArtifactOnlyPullRequest(files, ignorePatterns)) {
                    core.notice(
                      `PR #${pr}: artifact-only exception applied — all ${files.length} changed file(s) match ${IGNORE_MANIFEST_PATH}; no AI review round required. The unresolved-thread guard and all other required checks remain required.`,
                    );
                    try {
                      await github.rest.issues.addLabels({
                        owner,
                        repo,
                        issue_number: pr,
                        labels: ['ai-review:skipped-artifacts'],
                      });
                    } catch (labelError) {
                      core.info(
                        `PR #${pr}: audit label not applied (${labelError?.message ?? labelError}); the notice above is the audit record.`,
                      );
                    }
                    continue;
                  }

                  if (canUseDependabotManifestException({
                    authorLogin: pullRequest.data.user?.login,
                    files,
                    result,
                  })) {
                    core.notice(
                      `PR #${pr}: Dependabot manifest-only exception applied; Cursor does not review this PR class. All other required checks and the unresolved-thread guard remain required.`,
                    );
                    continue;
                  }
                }

                if (!result.ok) {
                  failures.push({ pr, reason: result.reason });
                  continue;
                }

                core.notice(`PR #${pr}: ${result.reason}`);
                } catch (error) {
                  if (!isTransientGithubLookupError(error)) throw error;
                  evaluatedCount += 1;
                  core.info(
                    `PR #${pr}: transient GitHub lookup after retries (${error?.message ?? error}); polling again`,
                  );
                  failures.push({
                    pr,
                    reason: `transient github lookup: ${error?.message ?? error}`,
                  });
                }
              }

              return { failures, evaluatedCount, hasBlockers };
            }

            // Poll instead of a fixed sleep: pass the moment every required
            // reviewer has spoken on the current head. Explicit negative
            // signals (blockers) fail immediately — waiting on a blocker buys
            // nothing because a new push or review re-fires the gate; this run
            // self-supersedes at the top of the poll loop when the head advances
            // (concurrency is cancel-in-progress:false, so runs are never force-cancelled).
            const POLL_INTERVAL_MS = 20_000;
            const POLL_DEADLINE_MS = 7 * 60_000;
            const startedAt = Date.now();
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (;;) {
              // Self-supersession, checked BEFORE evaluating so the SUCCESS path
              // also respects the head anchor (cursor ObzZ5): if the head advanced
              // past the SHA that triggered this run, a newer run now owns the
              // current head's gate — exit neutral rather than validate or claim
              // success for a commit that is no longer head. cancel-in-progress:false
              // never force-cancels us, so this is how a superseded run yields
              // instead of polling a stale head to the deadline.
              if (triggerHeadSha) {
                const current = await withTransientGithubRetry(() =>
                  github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: pullRequestNumbers[0],
                  }),
                );
                const currentHeadSha = current.data.head?.sha;
                if (currentHeadSha && currentHeadSha !== triggerHeadSha) {
                  core.notice(
                    `AI review gate superseded: head advanced ${triggerHeadSha.slice(0, 7)} -> ${currentHeadSha.slice(0, 7)}. A newer run gates the current head; exiting without blocking.`,
                  );
                  // Conclude the required `ai-reviewers` context neutral on the
                  // SHA this run was triggered for. A bare return would let the
                  // job conclude success — or let concurrency mark it cancelled —
                  // and a `cancelled` suite keeps the ruleset context red forever
                  // because branch rulesets evaluate the context against EVERY
                  // suite on the head and dead suites never re-evaluate (#2147).
                  // `neutral` satisfies the ruleset and matches the documented
                  // "exits neutral by design, never blocks merge" contract.
                  // Best-effort: fork PRs get a read-only GITHUB_TOKEN, so
                  // checks.create returns 403. Never turn a supersession into a
                  // job failure — on any error, note it and fall through to the
                  // same bare return as before (cursor, #2154). The workflow_run
                  // neutralizer (ai-review-gate-neutralizer.yml) runs in the
                  // base-repo context with a writable token and covers the fork
                  // case, plus runs cancelled before the poll loop ever started.
                  try {
                    await github.rest.checks.create({
                      owner,
                      repo,
                      name: 'ai-reviewers',
                      head_sha: triggerHeadSha,
                      status: 'completed',
                      conclusion: 'neutral',
                      output: {
                        title: 'Superseded',
                        summary: `Head advanced ${triggerHeadSha.slice(0, 7)} -> ${currentHeadSha.slice(0, 7)}; a newer AI review gate run owns the current head. This run exits neutral by design and never blocks merge.`,
                      },
                    });
                  } catch (error) {
                    core.notice(
                      `AI review gate supersession could not post a neutral check-run (${error?.message ?? error}); exiting without blocking. The workflow_run neutralizer covers this head from the base-repo context.`,
                    );
                  }
                  return;
                }
              }
              const { failures, evaluatedCount, hasBlockers } = await evaluatePullRequests();

              if (evaluatedCount === 0) {
                core.setFailed('AI review gate did not evaluate any non-draft pull requests.');
                return;
              }

              if (failures.length === 0) {
                return;
              }

              const elapsedMs = Date.now() - startedAt;
              if (hasBlockers || elapsedMs + POLL_INTERVAL_MS > POLL_DEADLINE_MS) {
                core.setFailed(
                  `AI review gate failed for ${failures.map((failure) => `#${failure.pr}: ${failure.reason}`).join(' | ')}`,
                );
                return;
              }

              core.info(
                `AI review activity incomplete after ${Math.round(elapsedMs / 1000)}s — polling again in ${POLL_INTERVAL_MS / 1000}s.`,
              );
              await sleep(POLL_INTERVAL_MS);
            }
