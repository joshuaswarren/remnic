name: Container

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/remnic-core/**
      - packages/remnic-server/**
      - admin-console/**
      - docs/patches/**
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-relevant:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      match: ${{ steps.f.outputs.match }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            match:
              - Dockerfile
              - .dockerignore
              - .github/workflows/container.yml
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - packages/remnic-core/**
              - packages/remnic-server/**
              - admin-console/**
              - docs/patches/**

  build:
    needs: docker-relevant
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request' ||
        startsWith(github.ref, 'refs/tags/v') ||
        (needs.docker-relevant.result == 'success' && needs.docker-relevant.outputs.match == 'true')
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        qmd-explicit-build: ${{ fromJSON(github.event_name == 'pull_request' && '["false","true"]' || '["false"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: QMD_EXPLICIT_BUILD=${{ matrix.qmd-explicit-build }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ github.event_name == 'pull_request' && 'remnic-container-smoke' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qmd-${{ matrix.qmd-explicit-build }}
          cache-to: type=gha,scope=qmd-${{ matrix.qmd-explicit-build }},mode=max

      - name: Smoke-test packaged QMD
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint sh remnic-container-smoke -ec '
            qmd --version
            grep -Fq "qmd rerank aborted" /usr/local/lib/node_modules/@tobilu/qmd/dist/llm.js
            grep -Fq "qmd query aborted" /usr/local/lib/node_modules/@tobilu/qmd/dist/mcp/server.js
          '
