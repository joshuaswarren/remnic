name: Dependency Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # A single global group lets each stack update evict every other open PR's
  # pending run (GitHub allows one pending slot per group), leaving required
  # checks cancelled before any job starts. Key the group per PR so each pull
  # request owns its slot.
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false


jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
