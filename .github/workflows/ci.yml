name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A superseded push should not keep burning runners: cancel in-flight runs for
# the same PR. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-risky-paths:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      entity_hardening: ${{ steps.filter.outputs.entity_hardening }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect high-risk review surfaces
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            entity_hardening:
              - 'src/orchestrator.ts'
              - 'src/storage.ts'
              - 'src/storage/**'
              - 'src/orchestration/**'
              - 'src/intent.ts'
              - 'src/memory-cache.ts'
              - 'src/entity-retrieval.ts'
              - 'src/config.ts'
              - 'packages/remnic-core/src/orchestrator.ts'
              - 'packages/remnic-core/src/storage.ts'
              - 'packages/remnic-core/src/storage/**'
              - 'packages/remnic-core/src/orchestration/**'
              - 'packages/remnic-core/src/intent.ts'
              - 'packages/remnic-core/src/memory-cache.ts'
              - 'packages/remnic-core/src/entity-retrieval.ts'
              - 'packages/remnic-core/src/config.ts'

  entity-hardening:
    needs: detect-risky-paths
    if: needs.detect-risky-paths.outputs.entity_hardening == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm rebuild better-sqlite3

      - name: Entity hardening suite
        run: pnpm run test:entity-hardening

  # Static analysis: no native binding, no build artifacts needed beyond the
  # core build that check-types performs itself.
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check-types

      - name: Review pattern check
        run: bash scripts/check-review-patterns.sh

      - name: Config contract (v1 + v2, issue #1990)
        run: npm run check-config-contract

      # Merge-skew scoping (issue #1995): on PRs, per-file ceiling failures
      # only fire for files THIS PR changed — a PR must not fail because an
      # unrelated merge grew a grandfathered file on main after this PR's
      # baseline was committed. Pushes to main evaluate everything.
      - name: Compute PR changed files for ratchet scoping
        if: github.event_name == 'pull_request'
        run: |
          # Merge base (three-dot), not two-tree: a queued run's merge commit can
          # predate BASE_REF advancing, and a two-tree diff would then pull
          # base-branch-only changes into this PR's scope (round-9 finding).
          # A depth-1 fetch of an ADVANCED base has no common ancestor with the
          # depth-1 merge-commit checkout, and the three-dot diff dies with
          # "no merge base" (round-10 finding) - unshallow both sides first.
          # --unshallow fails on an already-complete repo; fall back to a plain
          # fetch in that case.
          git fetch --quiet --unshallow origin "$BASE_REF" 2>/dev/null \
            || git fetch --quiet origin "$BASE_REF"
          if ! git merge-base FETCH_HEAD HEAD >/dev/null 2>&1; then
            echo "::error::no merge base between $BASE_REF and HEAD after full fetch - cannot scope the ratchet safely"
            exit 1
          fi
          git -c core.quotePath=off diff --name-only -z FETCH_HEAD...HEAD > /tmp/ratchet-changed-files.txt
          echo "changed files: $(tr -cd "\0" < /tmp/ratchet-changed-files.txt | wc -c)"
          echo "REMNIC_RATCHET_CHANGED_FILES_PATH=/tmp/ratchet-changed-files.txt" >> "$GITHUB_ENV"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Structural ratchets
        run: node scripts/check-ratchets.mjs

      - name: Docs-code parity
        run: node scripts/check-docs-parity.mjs

  # The root suite (895 files) sharded by pattern group so shards run in
  # parallel. TEST_PATTERN_GROUPS in scripts/root-test-runner-lib.mjs is an
  # exact partition of TEST_PATTERNS (enforced by test), so the union of the
  # shards below is exactly the unsharded suite.
  #
  # Runner selection (public repo, self-hosted safety): the self-hosted
  # `remnic` pool (jarvis CTs 340-342, homelab-infra) only serves pushes to
  # main and SAME-REPO pull requests. Fork PRs — even ones whose workflows a
  # maintainer approved — run on GitHub-hosted runners so external code can
  # never execute on homelab hardware. Pool down? Temporarily replace the
  # expression with 'ubuntu-latest'.
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # remnic pool only for same-repo PRs and main-ref runs; workflow_dispatch
    # on any other ref stays on hosted runners (codex P2 on #1608).
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && 'remnic' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: root
            groups: '--group root --group misc'
          - shard: packages
            groups: '--group packages'
    name: tests (${{ matrix.shard }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm rebuild better-sqlite3

      # Tests need @remnic/core dist (the test runner links against it).
      # @remnic/bench dist is NOT pre-built here on purpose: the root test
      # runner (scripts/run-root-tests.mjs) now self-serves it via
      # ensurePackageBuild, so a missing bench/dist no longer breaks the
      # suite (issue #1609). Leaving it unbuilt here exercises the exact
      # fresh-clone path on every CI run — if the runner's ensure regresses,
      # CI fails loudly instead of passing via a side-effect.
      - name: Build core
        run: pnpm --filter @remnic/core build

      # CI hard-requires capability tests (#1541), which in turn hard-require
      # `uv` for the AMB runner scripts. Install it on the runner so the gate
      # has the capability it demands.
      - name: Setup uv
        uses: astral-sh/setup-uv@v5


      - name: Tests
        run: node scripts/run-root-tests.mjs ${{ matrix.groups }}
        env:
          # CI rebuilds the native binding above; skipping native-dependent
          # suites here would silently drop coverage (#1538).
          REMNIC_REQUIRE_NATIVE_TESTS: "1"
          # CI treats environment-dependent capability tests as required
          # (uv for AMB runner scripts, clean working tree for SOTA
          # provenance — #1541). A missing tool or dirty tree fails the run
          # locally instead of counting a silent skip.
          REMNIC_REQUIRE_CAPABILITY_TESTS: "1"

  build-artifacts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm rebuild better-sqlite3

      - name: Build
        run: pnpm run build

      - name: Release artifact smoke test
        run: node scripts/check-release-artifacts.mjs

  # Aggregator that preserves the required status-check context `quality`
  # (branch ruleset) while the real work runs in parallel jobs above. Fails
  # unless every dependency succeeded — skipped/cancelled deps are failures,
  # never silently accepted.
  quality:
    needs: [checks, tests, build-artifacts]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all CI jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          failed=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$failed" ]; then
            echo "::error::CI gate failed — non-success jobs: $failed"
            exit 1
          fi
          echo "All CI jobs succeeded."
