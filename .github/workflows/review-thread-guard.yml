name: Review Thread Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  # write scopes are used ONLY when REVIEW_DEDUP_MODE=enforce, to post the
  # gate-authored canonical-link reply on a merged duplicate and apply the
  # duplicate-finding label; shadow mode performs no writes.
  pull-requests: write
  issues: write

jobs:
  unresolved-review-threads:
    # Intentionally NO concurrency group: check-unsticker reruns EVERY failed
    # review-thread-guard suite in one sweep (the ruleset blocks on each latest
    # failed/cancelled suite), and GitHub Actions concurrency is single-pending —
    # a group here would cancel intermediate reruns so some blocking suites never
    # get a passing attempt (codex P1). The check is cheap; per-event runs are fine.
    runs-on: ubuntu-latest
    steps:
      - name: Fail on unresolved review threads
        uses: actions/github-script@v7
        # Cross-reviewer dedup (issue #1994). Default 'shadow' logs the dedup
        # ledger without changing the unresolved count (byte-identical to
        # pre-#1994 behavior); flip to 'enforce' after the shadow window to let
        # a resolved canonical satisfy its duplicates.
        env:
          REVIEW_DEDUP_MODE: shadow
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // pull_request and pull_request_review_comment events include issue.number for the PR.
            // pull_request_review events include pull_request.number.
            const candidate =
              context.payload.pull_request?.number ??
              context.payload.issue?.number ??
              null;
            const pr = Number(candidate);
            if (!pr || Number.isNaN(pr)) {
              core.setFailed("Unable to determine pull request number for review-thread guard.");
              return;
            }

            const prMeta = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr,
            });
            if (prMeta.data.draft === true) {
              core.notice("Skipping unresolved review-thread gate for draft PR.");
              return;
            }

            const query = `
              query($owner: String!, $repo: String!, $pr: Int!, $after: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100, after: $after) {
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                      nodes {
                        id
                        isResolved
                        isOutdated
                        line
                        startLine
                        originalLine
                        originalStartLine
                        comments(first: 100) {
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                          nodes {
                            path
                            body
                            fullDatabaseId
                            author { login }
                            url
                            createdAt
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let threads = [];
            let after = null;
            while (true) {
              const result = await github.graphql(query, { owner, repo, pr, after });
              const conn = result.repository.pullRequest.reviewThreads;
              threads = threads.concat(conn.nodes || []);
              if (!conn.pageInfo?.hasNextPage) break;
              after = conn.pageInfo.endCursor;
            }
            // Page each thread's comments so a `not-a-duplicate` detach reply or
            // the gate's idempotency marker on a long thread (>100 comments) is
            // never missed — detach detection and hasGateReply scan every reply.
            const commentPageQuery = `
              query($id: ID!, $after: String) {
                node(id: $id) {
                  ... on PullRequestReviewThread {
                    comments(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        path
                        body
                        fullDatabaseId
                        author { login }
                        url
                        createdAt
                      }
                    }
                  }
                }
              }
            `;
            for (const t of threads) {
              let pageInfo = t.comments?.pageInfo;
              while (pageInfo?.hasNextPage) {
                const more = await github.graphql(commentPageQuery, { id: t.id, after: pageInfo.endCursor });
                const conn = more.node?.comments;
                if (!conn) break;
                t.comments.nodes = (t.comments.nodes || []).concat(conn.nodes || []);
                pageInfo = conn.pageInfo;
              }
            }
            // --- Cross-reviewer dedup (issue #1994, umbrella #1988) --------
            // Inline mirror of scripts/review-dedup.mjs (tested there — keep
            // the two copies in sync, same convention as the AI-review gate's
            // effective-diff mirror). Precision beats recall: two threads merge
            // ONLY on same file + overlapping line range + lexical fingerprint
            // at or above threshold. Nothing is deleted or hidden.
            const DEDUP = { shingleSize: 1, similarityThreshold: 0.5, directionalSetMin: 0.9, directionalOrderMax: 0.1 };
            const NON_DEDUP_LOGINS = new Set([
              "github-advanced-security",
              "github-advanced-security[bot]",
              "github-code-scanning[bot]",
            ]);
            const GATE_REPLY_MARKER = "<!-- remnic-review-dedup:duplicate -->";
            // Only the Actions bot posts the gate reply; the marker is public, so
            // require the author or a spoofed marker could fold a thread out of the
            // guard with no real gate-authored link (codex P2). Mirrors review-dedup.mjs.
            const GATE_REPLY_AUTHOR_LOGINS = new Set(["github-actions", "github-actions[bot]"]);
            const DUPLICATE_LABEL = "duplicate-finding";
            const formatDuplicateReply = (canonicalUrl) =>
              `${GATE_REPLY_MARKER}\n` +
              `Duplicate of ${canonicalUrl} — this finding is already tracked there, so it ` +
              `inherits that thread's resolution for the merge gate. Nothing is hidden: if ` +
              `the canonical is unresolved the finding still gates via it.\n\n` +
              "If this is a distinct finding, reply `not-a-duplicate` and it detaches back " +
              "into the round set within one gate cycle.";
            const hasGateReply = (t) =>
              (t.comments?.nodes ?? []).some(
                (c) =>
                  GATE_REPLY_AUTHOR_LOGINS.has(c?.author?.login ?? "") &&
                  (c?.body ?? "").includes(GATE_REPLY_MARKER),
              );
            const STOP = new Set(
              "a an and are as at be been but by can could de do does for from has have if in into is it its may of on or so than that the their then there these this to up was we when which will with would you your should shall here how why what where who"
                .split(" "),
            );
            const stripMarkup = (body) => {
              if (typeof body !== "string") return "";
              return body
                // Footer-anchored: strip only a line that STARTS (after markup/emoji/
                // HTML) with a footer phrase, not any line mentioning one — else a real
                // finding line is erased and distinct findings false-merge (codex P2).
                // Mirrors FEEDBACK_BOILERPLATE_PATTERN in review-dedup.mjs.
                .replace(/^(?:<[^>]*>|[^A-Za-z\n<])*(?:was this (?:report|comment) helpful|give feedback|react with|generated by|powered by)\b.*$/gim, " ")
                // Preserve fenced code (bounded, minus the language line) instead of
                // dropping it, or two findings whose only distinct facts are in
                // snippets collapse to identical prose and false-merge (codex P2).
                // Mirrors preserveFencedCode/FENCE_TOKEN_BUDGET in review-dedup.mjs.
                .replace(/```([\s\S]*?)```/g, (_m, inner) => ` ${inner.replace(/^[^\n]*\n/, "").replace(/[<>]/g, " ").slice(0, 200)} `)
                .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
                .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
                .replace(/`([^`]*)`/g, "$1")
                .replace(/<[^>]+>/g, " ")
                .replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}]/gu, " ")
                .toLowerCase()
                .replace(/\b(?:p[0-4]|sev[0-4]|nit|blocker|critical|major|minor|bug|issue|warning|suggestion)\b\s*[:.)\]-]*/gi, " ")
                .replace(/[#*_>`~[\]]/g, " ")
                .replace(/\s+/g, " ")
                .trim();
            };
            const tokensOf = (body) =>
              stripMarkup(body).split(/[^a-z0-9]+/).filter((t) => t.length >= 2 && !STOP.has(t));
            const fingerprint = (body, k = DEDUP.shingleSize) => {
              const toks = tokensOf(body);
              const kk = Math.max(1, k | 0);
              if (kk === 1) return new Set(toks);
              const s = new Set();
              for (let i = 0; i + kk <= toks.length; i++) s.add(toks.slice(i, i + kk).join(" "));
              if (s.size === 0 && toks.length) s.add(toks.join(" "));
              return s;
            };
            const similarity = (a, b, k = DEDUP.shingleSize) => {
              const fa = fingerprint(a, k);
              const fb = fingerprint(b, k);
              if (!fa.size || !fb.size) return 0;
              let inter = 0;
              for (const x of fa) if (fb.has(x)) inter++;
              const uni = fa.size + fb.size - inter;
              return uni === 0 ? 0 : inter / uni;
            };
            const anchorOf = (t) => {
              const c = t.comments?.nodes?.[0];
              const end = t.line ?? c?.line ?? t.originalLine ?? c?.originalLine;
              const startRaw =
                t.startLine ?? c?.startLine ?? t.originalStartLine ?? c?.originalStartLine ?? end;
              return {
                path: c?.path ?? t.path ?? null,
                start: Number.isInteger(startRaw) ? startRaw : null,
                end: Number.isInteger(end) ? end : null,
              };
            };
            const overlap = (a, b) => {
              if (!a.path || !b.path || a.path !== b.path) return false;
              if (a.start === null || a.end === null || b.start === null || b.end === null) return false;
              const [alo, ahi] = a.start <= a.end ? [a.start, a.end] : [a.end, a.start];
              const [blo, bhi] = b.start <= b.end ? [b.start, b.end] : [b.end, b.start];
              return alo <= bhi && blo <= ahi;
            };
            const loginOf = (t) => t.comments?.nodes?.[0]?.author?.login ?? t.author?.login ?? null;
            const bodyOf = (t) => t.comments?.nodes?.[0]?.body ?? t.body ?? "";
            const isDetached = (t) =>
              (t.comments?.nodes ?? []).slice(1).some((c) => {
                const body = c?.body ?? "";
                if (body.includes(GATE_REPLY_MARKER)) return false;
                return /\bnot-a-duplicate\b/i.test(body);
              });
            const createdOf = (t) => {
              const p = Date.parse(t.comments?.nodes?.[0]?.createdAt ?? t.createdAt ?? "");
              return Number.isFinite(p) ? p : 0;
            };
            // A resolved+outdated thread must not anchor later duplicates: its
            // anchor's code changed, so a NEW active finding on the same range
            // must not inherit its stale resolution (mirrors isStaleResolvedCanonical
            // in scripts/review-dedup.mjs — codex P2 false-merge fix).
            const isStaleCanonical = (t) => t.isResolved === true && t.isOutdated === true;
            const ordered = threads
              .map((t, i) => ({ t, i }))
              .sort((x, y) => createdOf(x.t) - createdOf(y.t) || x.i - y.i)
              .map((e) => e.t);
            const canonicals = [];
            const records = [];
            for (const t of ordered) {
              const anchor = anchorOf(t);
              const body = bodyOf(t);
              if (NON_DEDUP_LOGINS.has(loginOf(t) ?? "") || isDetached(t)) {
                records.push({ id: t.id, t, canonicalId: t.id, similarity: null });
                // Detached threads stay canonical candidates (a distinct finding
                // can anchor later duplicates); CodeQL/non-dedup threads must NOT
                // — the guard excludes them, so folding a real finding into a
                // CodeQL "canonical" would hide it. Resolved+outdated threads must
                // NOT anchor either (stale resolution). Mirrors dedupeThreads.
                if (!NON_DEDUP_LOGINS.has(loginOf(t) ?? "") && !isStaleCanonical(t)) {
                  canonicals.push({ id: t.id, anchor, body });
                }
                continue;
              }
              let match = null;
              let best = 0;
              for (const c of canonicals) {
                if (!overlap(anchor, c.anchor)) continue;
                const sim = similarity(body, c.body);
                if (sim < DEDUP.similarityThreshold || sim <= best) continue;
                // Directional guard: identical token set in reversed order ("X
                // instead of Y" vs "Y instead of X") is contradictory, not a
                // duplicate — cross-check the ordered bigram similarity. Mirrors
                // dedupeThreads in review-dedup.mjs.
                const orderSim = similarity(body, c.body, 2);
                if (sim >= DEDUP.directionalSetMin && orderSim <= DEDUP.directionalOrderMax) continue;
                match = c;
                best = sim;
              }
              if (match) {
                records.push({ id: t.id, t, canonicalId: match.id, similarity: best });
              } else {
                records.push({ id: t.id, t, canonicalId: t.id, similarity: null });
                if (!isStaleCanonical(t)) canonicals.push({ id: t.id, anchor, body });
              }
            }
            const dupRecords = records.filter((r) => r.canonicalId !== r.id);
            const canonicalResolved = new Map();
            for (const r of records) {
              if (r.canonicalId === r.id) canonicalResolved.set(r.id, r.t.isResolved === true);
            }

            const isGatingThread = (t) => {
              if (t.isResolved !== false) return false;
              // Exclude github-advanced-security (CodeQL) threads — these cannot be resolved
              // via the GitHub API and must be addressed through CodeQL configuration.
              return !NON_DEDUP_LOGINS.has(loginOf(t) ?? "");
            };
            const rawUnresolved = threads.filter(isGatingThread);

            // Shadow mode (default): the gating count is byte-identical to
            // pre-#1994 behavior; we only log the dedup ledger. Enforce mode:
            // a duplicate whose canonical is resolved folds into the canonical
            // (counted once) so resolving the canonical auto-satisfies it; a
            // duplicate whose canonical is UNRESOLVED still gates via that
            // canonical, so no distinct finding is ever hidden.
            const mode = (process.env.REVIEW_DEDUP_MODE || "shadow").toLowerCase();
            const applyInheritance = mode === "enforce";
            const wouldBeLost = dupRecords.filter(
              (r) => r.t.isResolved !== true && canonicalResolved.get(r.canonicalId) !== true,
            );
            // Audit trail (enforce only): filled by the write loop below with the
            // duplicate thread ids that carry the gate-authored canonical-link
            // reply. effectiveUnresolved (computed after the writes) folds a
            // duplicate only when it is audited, so a failed reply post never
            // silently hides a folded finding.
            const auditedDuplicateIds = new Set();

            const uniqueByReviewer = new Map();
            for (const r of records) {
              if (r.canonicalId !== r.id) continue;
              const login = loginOf(r.t) ?? "unknown";
              uniqueByReviewer.set(login, (uniqueByReviewer.get(login) ?? 0) + 1);
            }
            const ledger = [
              `Review-thread dedup [${mode}]: ${records.length} filed, ${dupRecords.length} deduplicated; unique-by-reviewer — ${
                [...uniqueByReviewer.entries()]
                  .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
                  .map(([l, n]) => `${l}: ${n}`)
                  .join(", ") || "none"
              }.`,
              ...dupRecords.map(
                (r) =>
                  `- ${loginOf(r.t) ?? "unknown"} duplicate of ${
                    records.find((x) => x.id === r.canonicalId)?.t.comments?.nodes?.[0]?.url ?? r.canonicalId
                  } (similarity ${r.similarity.toFixed(2)})`,
              ),
            ].join("\n");
            core.notice(ledger);
            if (wouldBeLost.length > 0) {
              core.warning(
                `${wouldBeLost.length} deduplicated finding(s) still surface via an unresolved canonical (none hidden). Reply 'not-a-duplicate' on any thread to detach it back into the round set.`,
              );
            }

            // Enforce mode only: leave an auditable trail ON each merged thread
            // — a gate-authored reply linking the canonical, plus a PR-level
            // duplicate-finding label — so a false merge is visible and the
            // one-reply not-a-duplicate escape hatch is discoverable. Idempotent
            // (skips threads already gate-replied). Shadow mode writes nothing.
            if (applyInheritance && dupRecords.length > 0) {
              let posted = false;
              for (const r of dupRecords) {
                if (hasGateReply(r.t)) {
                  auditedDuplicateIds.add(r.id);
                  continue;
                }
                // fullDatabaseId (64-bit safe, string). The deprecated numeric
                // id field is null for 64-bit ids, which would silently drop the
                // audit reply and block the duplicate fold (codex P2).
                const commentId = r.t.comments?.nodes?.[0]?.fullDatabaseId;
                if (!commentId) continue;
                const canonicalUrl =
                  records.find((x) => x.id === r.canonicalId)?.t.comments?.nodes?.[0]?.url ?? r.canonicalId;
                try {
                  await github.rest.pulls.createReplyForReviewComment({
                    owner,
                    repo,
                    pull_number: pr,
                    comment_id: commentId,
                    body: formatDuplicateReply(canonicalUrl),
                  });
                  posted = true;
                  auditedDuplicateIds.add(r.id);
                } catch (e) {
                  core.warning(`Could not post dedup reply on thread ${r.id}: ${e?.message ?? e}`);
                }
              }
              if (posted) {
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: pr,
                    labels: [DUPLICATE_LABEL],
                  });
                } catch (e) {
                  core.info(`duplicate-finding label not applied: ${e?.message ?? e}`);
                }
              }
            }

            // A duplicate folds into its canonical (stops gating on its own) ONLY
            // when its auditable gate reply is present — otherwise a failed reply
            // post would silently hide the folded finding. Unaudited duplicates
            // stay in the guard set so no fold is ever invisible. Canonicals and
            // standalones always gate on their own state. Mirrors the fold math
            // in computeGuardObligations, plus this workflow-only write fail-safe.
            const effectiveUnresolved = rawUnresolved.filter((t) => {
              const rec = records.find((r) => r.id === t.id);
              if (!rec || rec.canonicalId === rec.id) return true;
              return !auditedDuplicateIds.has(rec.id);
            });

            const unresolvedThreads = applyInheritance ? effectiveUnresolved : rawUnresolved;

            if (unresolvedThreads.length === 0) {
              core.notice("No unresolved review threads.");
              return;
            }

            const summary = unresolvedThreads
              .slice(0, 10)
              .map((t, i) => {
                const c = t.comments?.nodes?.[0];
                const author = c?.author?.login ?? "unknown";
                const path = c?.path ?? "unknown-file";
                const state = t.isOutdated === true ? "outdated" : "active";
                const url = c?.url ?? "";
                return `${i + 1}. ${author} on ${path} (${state})${url ? ` ${url}` : ""}`;
              })
              .join("\n");

            core.setFailed(
              `Found ${unresolvedThreads.length} unresolved review thread(s). Resolve them before merge.\n${summary}`,
            );
